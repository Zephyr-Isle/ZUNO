name: Release

# 打 v* 标签触发：构建通用 APK + 收集示例包 → 发 GitHub Release；
# 同时把 backend 打成镜像推到 GHCR（docker-compose.yml 默认拉这个镜像）。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  apk:
    name: Build APK + release assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 版本锁死在 3.47：仓库要求 Flutter 3.47+ / Dart 3.13+（pubspec sdk 约束），
      # 不锁 stable 最新版会让不同时间的产物不可比。
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.0
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # samples/ 同时是导入回归的 fixture，必须在仓库根目录跑。
      - name: Test
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      # ABI splits + universal（android/app/build.gradle.kts 里 isUniversalApk）。
      # Release 产物只挂 universal 包：体积大一档，但谁都能装。
      - name: Collect release assets
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          cp build/app/outputs/apk/release/app-release.apk "dist/ZUNO-${VERSION}.apk"
          cp samples/*.zuno dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true

  docker:
    name: Build & push GHCR image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/zuno-api
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
